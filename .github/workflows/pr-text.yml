# A squash merge takes the pull request title as the `main` subject and the
# body as its message, so both get the checks a commit gets at `commit-msg`:
# Conventional subject, no emdash, no emoji, no claude.ai/code/session link.
#
# Its own workflow rather than a job in ci-web.yml because it has to re-run
# when the title or body is edited, and `edited` on ci-web.yml would re-run the
# whole browser suite for a typo fix in the description.
name: pr-text

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-text:
    # Dependabot bodies embed upstream release notes. A skipped job satisfies
    # a required check.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Title and body arrive through env, never interpolated into the script,
      # so a body is data and cannot become shell.
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/check-commit-message.mjs --stdin
