[package]
name = "LumiLab"
version = "5.0.1"
description = "GUI to calibrate HDR images using Radiance, hdrgen, and dcraw_emu."
authors = ["Clotilde Pierson", "Alexander Ulbrich"]
license = "GNU General Public License v3.0"
repository = "https://github.com/radiantlab/LumiLab"
default-run = "LumiLab"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri-build = "2.0"

# Nothing here is used by the crate itself any more. `main.rs` registers
# plugins and shows a window; the pipeline, the RAW converter and the image
# cache all moved to WebAssembly and IndexedDB in the frontend, which took
# `image`, `rayon`, `blake3`, `chrono` and `serde` with them.
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-opener = "2"
tauri-plugin-wdio-webdriver = { version = "1.2.0", optional = true }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]
e2e-driver = ["dep:tauri-plugin-wdio-webdriver"]
